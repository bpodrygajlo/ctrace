name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04 - GCC (All Backends)"
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            cmake_flags: "-DCTRACE_ENABLE_ZSTD=ON -DCTRACE_ENABLE_SQLITE=ON"

          - name: "Ubuntu 24.04 - Clang 18 (All Backends)"
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            cmake_flags: "-DCTRACE_ENABLE_ZSTD=ON -DCTRACE_ENABLE_SQLITE=ON"

          - name: "Ubuntu 24.04 - Zero External Dependencies (stdout, bin, ctf)"
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            cmake_flags: "-DCTRACE_ENABLE_ZSTD=OFF -DCTRACE_ENABLE_SQLITE=OFF -DCTRACE_FORCE_BUILTIN_JSON=ON"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            cmake \
            ninja-build \
            clang-18 \
            libclang-18-dev \
            llvm-18-dev \
            libsqlite3-dev \
            libzstd-dev \
            nlohmann-json3-dev \
            babeltrace2 \
            python3

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_flags }}

      - name: Build Targets
        run: |
          cmake --build build --parallel

      - name: Run Test Suite (CTest)
        run: |
          ctest --test-dir build --output-on-failure --parallel

      - name: Verify Package Installation
        run: |
          cmake --install build --prefix /tmp/ctrace_install
          test -f /tmp/ctrace_install/bin/ctrace-scan
          test -f /tmp/ctrace_install/bin/ctrace-gen
          test -f /tmp/ctrace_install/include/ctrace/trace.h
          test -f /tmp/ctrace_install/lib/libctrace_rt_bin.a
